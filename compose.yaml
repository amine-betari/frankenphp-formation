name: frankenphp-symfony-lab

x-healthcheck: &healthcheck
  test: ["CMD", "php", "-r", "exit(false === @file_get_contents('http://localhost/health') ? 1 : 0);"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 10s

services:
  mercure:
    image: dunglas/mercure
    network_mode: bridge
    environment:
      SERVER_NAME: :80
      MERCURE_PUBLISHER_JWT_KEY: mercure-local-development-secret
      MERCURE_SUBSCRIBER_JWT_KEY: mercure-local-development-secret
      MERCURE_TRUSTED_ISSUERS: https://frankenphp.local
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins http://localhost:8384
        resource_identifier http://localhost:3001/.well-known/mercure
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  php-demo:
    image: dunglas/frankenphp:1-php8.5-bookworm
    network_mode: bridge
    environment:
      SERVER_NAME: :80
    ports:
      - "8282:80"
    volumes:
      - ./franken-test/public:/app/public:ro
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
    healthcheck: *healthcheck
    tty: true

  symfony-classic:
    image: dunglas/frankenphp:1-php8.5-bookworm
    network_mode: bridge
    working_dir: /app
    environment:
      SERVER_NAME: :80
      APP_ENV: dev
      DEMO_MODE: classique
      MERCURE_URL: http://host.docker.internal:3001/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3001/.well-known/mercure
      MERCURE_JWT_SECRET: mercure-local-development-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8384:80"
    volumes:
      - ./franken-symfony:/app
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
    healthcheck: *healthcheck
    tty: true

  symfony-worker:
    image: dunglas/frankenphp:1-php8.5-bookworm
    network_mode: bridge
    working_dir: /app
    environment:
      SERVER_NAME: :80
      APP_ENV: dev
      DEMO_MODE: worker
      MERCURE_URL: http://host.docker.internal:3001/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3001/.well-known/mercure
      MERCURE_JWT_SECRET: mercure-local-development-secret
      FRANKENPHP_CONFIG: |
        worker {
          file ./public/index.php
          num 10
          watch
        }
    ports:
      - "8385:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./franken-symfony:/app
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
    healthcheck: *healthcheck
    tty: true
